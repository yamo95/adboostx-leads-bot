name: Publisher Delivery - Private Contact Desk
on:
  push:
    branches: [main]
    paths: [.github/workflows/publisher-delivery-143e7625.yml]
  workflow_dispatch:
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: write
concurrency:
  group: publisher-delivery-143e7625
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: runtime/publisher_cloud
    env:
      SEED_BATCH: all
      PYTHONUNBUFFERED: '1'
      EXPECTED_KEY: 143e76257be2ace1aab7f3236de0d3e70007e88f24d867d2a256c60b5486bbdc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9d72836b8cce747322553eee8c0ce236127e8465
          path: runtime
          persist-credentials: false
          sparse-checkout: publisher_cloud
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements.txt
      - name: Configure the delivered operator public key
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          raw = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAnIu7C4tm9/5jEa/4hov/
          nTvSn4bAB35acRqEfXQtsnQxgY7n53ZG8Qi7bjTXc/HbT4ro1gEXZDAJ2b8k9Wv+
          DkFtgXJqGwKiIf1c80bxbjdfgKV3fcTfAW/ayXqSPL379FK2HfF4E9JnopeTD3mk
          ArdnZ0akXTao/GSx/zd8RQHCPwml526O9KCnEPjK+OUPfnSfycw1yla5ymSBkl88
          5Jb7ikyTG6EbRfwiZFTzrXv1xCpUxxwUuB4npe+3l6ykcqqa/vdAwG8aMs3C+y8k
          AO59nS2dFlGFNpGAqctXUWVleOrRAmU25mSLsB1y5Fp4CS1MR+3KKbkU/YSPVJs/
          MVSVdhs75eIUKC/CaMaWkoFPQWraTf/k1bWQvJEmKrDU8H76sG7F8HxagPuTje0I
          eyNjJ8C+rMhzo99f76xD4d41MXbu6DwrP4fKA6U8PFfgL/DcHqFXs3DG23k6awBS
          743Bwc9j/hYbwH/3fCtHf1Q96ZHzlqhJFNo2Kj6K5zZXAgMBAAE=
          -----END PUBLIC KEY-----
          '''
          key = serialization.load_pem_public_key(raw)
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert key.key_size >= 3072 and hashlib.sha256(der).hexdigest() == os.environ['EXPECTED_KEY']
          Path('recipient.pem').write_bytes(raw)
          print('Delivered public key validated. No private key on the runner.')
          PY
      - name: Test URL guards extraction and encryption
        run: python3 -m unittest -v test_scan
      - name: Scan public pages without credentials
        run: python3 scan.py
      - name: Publish encrypted report and counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          import scan
          env = json.loads(Path('sealed/results.encrypted.json').read_text())
          summary = json.loads(Path('sealed/summary.json').read_text())
          assert set(env) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert env['format'] == scan.FORMAT and env['key_id'] == os.environ['EXPECTED_KEY']
          assert len(base64.b64decode(env['nonce'], validate=True)) == 12
          assert len(base64.b64decode(env['wrapped_key'], validate=True)) == 384
          base64.b64decode(env['ciphertext'], validate=True)
          assert set(summary) <= {'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice'}
          assert summary['run_id'] == os.environ['GITHUB_RUN_ID']
          # A separate index avoids interleaving with earlier experimental reports.
          original = scan.gh
          def isolated(method, endpoint, payload=None):
              endpoint = endpoint.replace('publisher-results/', 'publisher-delivery-143e7625/')
              if payload and 'content' in payload and '/index.json' in endpoint:
                  obj = json.loads(base64.b64decode(payload['content']))
                  for row in obj.get('runs', []):
                      row['path'] = row['path'].replace('publisher-results/', 'publisher-delivery-143e7625/')
                  payload = dict(payload, content=base64.b64encode(json.dumps(obj).encode()).decode())
              return original(method, endpoint, payload)
          scan.gh = isolated
          scan.publish(env, summary)
          print('Encrypted report published to isolated delivery index.')
          PY
      - name: Save encrypted downloadable report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publisher-delivery-${{ github.run_id }}
          path: |
            runtime/publisher_cloud/sealed/results.encrypted.json
            runtime/publisher_cloud/sealed/summary.json
          retention-days: 7
          if-no-files-found: warn
