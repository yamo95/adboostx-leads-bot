name: Publisher Contacts - Operator Delivery
on:
  push:
    branches: [main]
    paths: [.github/workflows/publisher-operator-06627b.yml]
  workflow_dispatch:
    inputs:
      batch:
        description: Seed batch
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: write
concurrency:
  group: publisher-operator-06627b
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Load pinned tested scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ab7938ec32a6f5ebc2fb5c5966c1c79aa723ee1e
          persist-credentials: false
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements.txt
      - name: Tests
        run: python3 -m unittest -v test_scan
      - name: Scan and encrypt without repository credentials
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          import scan
          raw = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA4AsWuOgQ95ipeSw5fVs3
          Iwfsf3eDjgoDx7suskvvcyIcSBqDWFNeq5uHQNYu07oY9CGjQt21XBJjk9//EEP8
          cOyMKbj+NseBAYqupkiF3WGYBJXqiIncki04ud1Gc5hKlMY0NuDpiOAm+NeaDlyF
          P5bOIIa4mDYdP6t/8xVDCKZt7wObt/OnFknZNnBdHREz78obNOZophfDwPfwaxkh
          ZXjhE2Sfjk8f7uYR64PDWeB102jxfx4G45ILsGj0n6qKJ8LOjjmqgC/fRHHIOBZU
          uJuMzNdAmEInKks5Eif4HDnBnZD59qIbJu2kjH42UEZSJbpQClRye/r5C0vuQCcY
          Vtdxbt0y+GiCxND+quYws9lvzJ/YvMBo2J1Ds3QCl2tv1kGN3VjaDOfZ4fGe7dBb
          uJu6qFd6oi9kTxm/U7aVEuApfLMeXMmUVDtsF5h1bebvj2HBtqHYGDu+GC4K6Ad3
          /LZUpP4Jk3KjAycP4OqwJ3ofFVfrXFzstFoTJFcLWqErAgMBAAE=
          -----END PUBLIC KEY-----
          '''
          key = serialization.load_pem_public_key(raw)
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == '06627b353b1980cd1f6b84eda791f0840b721932b1d85c6ee5403a2a2053a61d'
          Path('recipient.pem').write_bytes(raw)
          seal = scan.seal
          def compact(payload, public_key):
              packed = gzip.compress(json.dumps(payload,ensure_ascii=False,separators=(',',':')).encode(),mtime=0)
              return seal({'encoding':'gzip+base64','data':base64.b64encode(packed).decode()},public_key)
          scan.seal = compact
          raise SystemExit(scan.main())
          PY
      - name: Publish validated ciphertext into isolated operator directory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,re
          from pathlib import Path
          from scan import gh, FORMAT, stamp
          envelope=json.loads(Path('sealed/results.encrypted.json').read_text())
          summary=json.loads(Path('sealed/summary.json').read_text())
          key_id='06627b353b1980cd1f6b84eda791f0840b721932b1d85c6ee5403a2a2053a61d'
          assert set(envelope)=={'format','key_id','wrapped_key','nonce','ciphertext'}
          assert envelope['format']==FORMAT and envelope['key_id']==key_id
          assert len(base64.b64decode(envelope['nonce'],validate=True))==12
          assert len(base64.b64decode(envelope['wrapped_key'],validate=True))==384
          base64.b64decode(envelope['ciphertext'],validate=True)
          assert set(summary)<={'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice'}
          assert summary['run_id']==os.environ['GITHUB_RUN_ID']
          rid=os.environ['GITHUB_RUN_ID']+'-'+os.environ.get('GITHUB_RUN_ATTEMPT','1')
          assert re.fullmatch(r'[0-9-]+',rid)
          prefix='publisher-operator-06627b'
          path=prefix+'/runs/'+rid+'.json'
          def put(path,obj):
              old=gh('GET','contents/'+path+'?ref=main')
              data={'branch':'main','message':'Store operator encrypted report '+rid,'content':base64.b64encode(json.dumps(obj).encode()).decode()}
              if old:data['sha']=old['sha']
              gh('PUT','contents/'+path,data)
          put(path,envelope)
          old=gh('GET','contents/'+prefix+'/index.json?ref=main')
          index=json.loads(base64.b64decode(old['content'])) if old else {'format':1,'runs':[]}
          index['runs']=[{'path':path,'key_id':key_id,'summary':summary}]+[x for x in index['runs'] if x['path']!=path]
          index['runs']=index['runs'][:60]
          index['updated_at']=stamp()
          index['note']='Encrypted reports. Removed index entries remain in Git history.'
          put(prefix+'/index.json',index)
          print('Operator encrypted report published. No plaintext contact output or private keys uploaded.')
          PY
      - name: Deliver encrypted acceptance artifact
        if: ${{ always() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: operator-06627b-${{ github.run_id }}
          path: publisher_cloud/sealed/
          retention-days: 3
          if-no-files-found: error
