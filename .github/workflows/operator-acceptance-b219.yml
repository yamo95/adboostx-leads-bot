name: Publisher Contacts B219 - Scheduled Scans
run-name: ${{ (inputs.batch == 'search' || inputs.batch == 'fresh') && format('B219 search {0} page {1}', inputs.round_id, inputs.page) || github.workflow }}
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/operator-acceptance-b219.yml
  workflow_dispatch:
    inputs:
      batch:
        description: Fresh discovery with bounded versioned rechecks; legacy rounds remain resumable
        type: choice
        options: [auto, enrich, deep, next, all, search, fresh, '0', '1', '2', '3']
        default: enrich
      round_id:
        description: Search round ID supplied by the results page
        type: string
        default: ''
      page:
        description: Non-wrapping search page, 0 through 12
        type: string
        default: '0'
      pool_hash:
        description: Candidate pool fingerprint from the preceding encrypted report
        type: string
        default: ''
      seen_hosts:
        description: Compact site-history fingerprints; no contact values or keys
        type: string
        default: ''
      recheck_hosts:
        description: At most 80 previously scanned site fingerprints for this extraction revision
        type: string
        default: ''
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: write
concurrency:
  group: publisher-desk-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'fresh' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Preserve accepted scanner and existing report key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 462fb23fc114a26e318fa4379e2aa2b8d49a070b
          persist-credentials: false
      - name: Load reviewed discovery and contact enrichment adapters
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d1f1151aca151f6c7d45f7e84f9a2677f08c7d7e
          path: quantity-config
          sparse-checkout: |
            publisher_cloud/quantity_expansion.py
            publisher_cloud/test_quantity_expansion.py
            publisher_cloud/scale_profile.py
            publisher_cloud/test_scale_profile.py
            publisher_cloud/growth_profile.py
            publisher_cloud/test_growth_profile.py
            publisher_cloud/continuation_profile.py
            publisher_cloud/test_continuation_profile.py
            publisher_cloud/deep_profile.py
            publisher_cloud/test_deep_profile.py
            publisher_cloud/deep_candidates.json
            publisher_cloud/messaging_enrichment.py
            publisher_cloud/test_messaging_enrichment.py
            publisher_cloud/enrichment_candidates.json
            publisher_cloud/additional_candidates_20260909.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Load reviewed interactive search adapter only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 71f34b5e45222f01e60c01baf8cf824c74101664
          path: search-config
          sparse-checkout: |
            publisher_cloud/search_round.py
            publisher_cloud/test_search_round.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Load rotating discovery and versioned extraction adapters
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3792d429ab535fcd41edf6aee143c0a789adf99b
          path: fresh-config
          sparse-checkout: |
            publisher_cloud/fresh_discovery.py
            publisher_cloud/discovery_sources.py
            publisher_cloud/catalog_candidates.py
            publisher_cloud/messaging_enrichment.py
            publisher_cloud/contact_context.py
            publisher_cloud/test_fresh_discovery.py
            publisher_cloud/test_discovery_sources.py
            publisher_cloud/test_catalog_candidates.py
            publisher_cloud/test_whatsapp_context.py
            publisher_cloud/fresh_candidates.json
            publisher_cloud/fresh_seen_bootstrap.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install and test discovery and public-contact extraction
        run: |
          python3 -m pip install -r requirements.txt
          for file in ../quantity-config/publisher_cloud/* ../search-config/publisher_cloud/* ../fresh-config/publisher_cloud/*; do
            cp "$file" .
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('scanner_core.py')
          raw = p.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert blob == '28a3fa16f1849a14958ddf3a9f8eea58385f2ffe', 'Unexpected scanner revision'
          source = raw.decode()
          old = "desc.get_text(' ',strip=True)"
          assert source.count(old) == 1
          p.write_text(source.replace(old, "desc.get_text('',strip=False)"))
          PY
          python3 -m unittest -v test_scan test_quantity_expansion test_scale_profile test_growth_profile test_continuation_profile test_deep_profile test_messaging_enrichment test_search_round test_fresh_discovery test_discovery_sources test_whatsapp_context test_catalog_candidates
          python3 - <<'PY'
          import asyncio
          from scan import route, telegram_hops
          class Fixture:
              async def get(self, url, **kwargs):
                  if url.endswith('/ChannelDemo'):
                      return {'state':'ok','html':'<div class="tgme_page_extra">100 subscribers</div><div class="tgme_page_description">Support: <a>@HelpDemo</a><br>Advertising: <a>@AdsDemo</a><br>Our friend: <a>@FriendDemo</a></div>'}
                  return {'state':'ok','html':'<div>Send Message</div>'}
          start = route('https://t.me/ChannelDemo', 'Updates', 'https://publisher.example/contact')
          rows = asyncio.run(telegram_hops([start], Fixture()))
          found = {row['contact']:row for row in rows}
          assert '@FriendDemo' not in found
          assert found['@HelpDemo']['role'] == 'support'
          assert found['@AdsDemo']['role'] == 'business'
          print('Role-boundary regression passed.')
          PY
      - name: Add public candidates without discarding existing scan targets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import deep_profile as deep
          additions = json.loads(Path('additional_candidates_20260909.json').read_text())
          assert isinstance(additions, list) and len(additions) == 54
          checked = deep.target_rows(additions)
          assert len(checked) == len(additions), 'Invalid or duplicate public candidate URL'
          assert all(isinstance(u, str) and '@' not in u for u in additions)
          for filename in ('deep_candidates.json', 'enrichment_candidates.json'):
              path = Path(filename)
              previous = json.loads(path.read_text())
              rows = deep.target_rows(previous + additions)
              assert {deep.growth.scan.host(u) for u in previous} <= {deep.growth.scan.host(r['url']) for r in rows}
              assert len(rows) <= 500
              path.write_text(json.dumps([r['url'] for r in rows], indent=2))
              print(json.dumps({'candidate_list':filename,'before':len(previous),'after':len(rows),'contacts_imported':0}))
          PY
      - name: Prepare attributed daily domain candidates with a persisted request guard
        if: env.SEED_BATCH == 'fresh'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 catalog_candidates.py
      - name: Confirm existing private-viewer public key
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          raw = Path('recipient-b219c932.pem').read_bytes()
          key = serialization.load_pem_public_key(raw)
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == 'b219c932768c4a5e52dda6bec834872f899811fe5142b0cd34f4f113afadf29b'
          Path('recipient.pem').write_bytes(raw)
          PY
      - name: Scan websites and their public contact previews without credentials
        env:
          SEARCH_ROUND_ID: ${{ inputs.round_id }}
          SEARCH_PAGE: ${{ inputs.page || '0' }}
          SEARCH_POOL_HASH: ${{ inputs.pool_hash }}
          SEARCH_SEEN_HOSTS: ${{ inputs.seen_hosts }}
          SEARCH_RECHECK_HOSTS: ${{ inputs.recheck_hosts }}
        run: python3 fresh_discovery.py
      - name: Publish authenticated ciphertext and retain report history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          import scan
          import fresh_discovery
          envelope = json.loads(Path('sealed/results.encrypted.json').read_text())
          summary = json.loads(Path('sealed/summary.json').read_text())
          assert set(envelope) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert envelope['format'] == scan.FORMAT
          assert envelope['key_id'] == 'b219c932768c4a5e52dda6bec834872f899811fe5142b0cd34f4f113afadf29b'
          assert len(base64.b64decode(envelope['nonce'], validate=True)) == 12
          assert len(base64.b64decode(envelope['wrapped_key'], validate=True)) == 384
          assert len(base64.b64decode(envelope['ciphertext'], validate=True)) >= 16
          assert summary['run_id'] == os.environ['GITHUB_RUN_ID']
          mode = os.environ['SEED_BATCH']
          cap = 120 if mode in {'search','fresh'} else 500 if mode in {'all','next','deep','enrich'} else 240
          if mode == 'fresh' and summary['status'] == 'FRESH_CANDIDATES_EXHAUSTED':
              assert summary['seeds_scanned'] == 0 and summary['contact_evidence_records'] == 0
          else:
              assert 0 < summary['seeds_scanned'] <= cap
          assert summary['sites_checked'] <= cap + 12
          fresh_discovery.publish(envelope, summary)
          PY
      - name: Retain encrypted acceptance data and public testable adapters
        if: ${{ always() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-operator-b219-${{ github.run_id }}
          path: |
            publisher_cloud/sealed/*.json
            publisher_cloud/scan.py
            publisher_cloud/scanner_core.py
            publisher_cloud/*profile.py
            publisher_cloud/quantity_expansion.py
            publisher_cloud/deep_candidates.json
            publisher_cloud/additional_candidates_20260909.json
            publisher_cloud/messaging_enrichment.py
            publisher_cloud/enrichment_candidates.json
            publisher_cloud/search_round.py
            publisher_cloud/fresh_discovery.py
            publisher_cloud/discovery_sources.py
            publisher_cloud/catalog_candidates.py
            publisher_cloud/contact_context.py
            publisher_cloud/fresh_candidates.json
            publisher_cloud/fresh_seen_bootstrap.json
            publisher_cloud/test_*.py
            publisher_cloud/requirements.txt
            publisher_cloud/leadengine/*.py
          retention-days: 3
          if-no-files-found: error
