name: Publisher Contacts B219 - Scheduled Scans
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/operator-acceptance-b219.yml
  workflow_dispatch:
    inputs:
      batch:
        description: Public seed batch
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: write
concurrency:
  group: publisher-desk-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The source below passed live acceptance run 34267763817.
          # Upgrade deliberately; unrelated main-branch changes cannot rotate this key.
          ref: 462fb23fc114a26e318fa4379e2aa2b8d49a070b
          persist-credentials: false
      - name: Test accepted scanner and pair the private viewer
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest -v test_scan
          cp recipient-b219c932.pem recipient.pem
      - name: Scan public sources without repository credentials
        run: python3 scan.py
      - name: Publish authenticated ciphertext only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          import scan
          envelope = json.loads(Path('sealed/results.encrypted.json').read_text())
          summary = json.loads(Path('sealed/summary.json').read_text())
          assert set(envelope) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert envelope['format'] == scan.FORMAT
          assert envelope['key_id'] == 'b219c932768c4a5e52dda6bec834872f899811fe5142b0cd34f4f113afadf29b'
          assert len(base64.b64decode(envelope['nonce'], validate=True)) == 12
          assert len(base64.b64decode(envelope['wrapped_key'], validate=True)) == 384
          assert len(base64.b64decode(envelope['ciphertext'], validate=True)) >= 16
          assert summary['run_id'] == os.environ['GITHUB_RUN_ID']
          scan.publish(envelope, summary)
          PY
      - name: Retain encrypted acceptance data
        if: ${{ always() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-operator-b219-${{ github.run_id }}
          path: publisher_cloud/sealed/*.json
          retention-days: 3
          if-no-files-found: error
