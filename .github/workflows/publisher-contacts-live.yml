name: Publisher Contacts - Encrypted Live Scan

on:
  push:
    branches: [main]
    paths:
      - publisher_cloud/scan.py
      - publisher_cloud/test_scan.py
      - publisher_cloud/requirements.txt
      - publisher_cloud/seeds.txt
      - .github/workflows/publisher-contacts-live.yml
  workflow_dispatch:
    inputs:
      batch:
        description: Public seed batch
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: write
concurrency:
  group: publisher-production-results
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements.txt
      - name: Verify the final operator PUBLIC key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          raw = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAsDuarXMC2yziPnOX9pWD
          k2FCBi557pLRStREDi+emwTenId4xaOP8TaWNtSboCXUMzoVTfD7kcBI7+8Y8e/x
          XCVyZXAqmaf1Nix/VzN0PO/vGO3arowf+4CtBEhhVhjeYG604snr76scDGK9oZAP
          pfu7/qH8AMoBjEvRGGAPmiGx/7iSHZi3dT1PGg75jdbRKVV+9ZiKT/s0NTN0R8AC
          P9Wg1cwP6ahMFI7ATeIYIL8nCO0y1BNeUpgraIS1/m/CkRrrYf3YzcBPg2HL7FpA
          VIkLUR3NjGgUT8jwjggJy4DuzT2QoND/7PujNY6k9o4QfF9JYZimxVOTKYRr/qki
          eyGNNi3C+3y/i3lEpnM1s6OMBj2tnEqjatVi8hJNMhLMjPBYeTPs6Tvc0gzIxImS
          CpLoGja64+u/Wz9NnxmBBonGu6N7G0bnloBalbwRUmDwT55NAkVxnC+sMeis/CH6
          snmhmUx4FqxiZJFZI6lRlrrhWIscksVz7Ws3ppW2btdvAgMBAAE=
          -----END PUBLIC KEY-----
          '''
          key = serialization.load_pem_public_key(raw)
          assert isinstance(key, rsa.RSAPublicKey) and key.key_size >= 3072
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == 'eb9eb4640058a447025460219c89d7f417f7bf9c148d4c56d669eaf92ade4d5b'
          Path('recipient.pem').write_bytes(raw)
          print('Final operator public key verified. No private key is present.')
          PY
      - name: Test extraction and encryption
        run: python3 -m unittest -v test_scan
      - name: Scan and encrypt without repository credentials
        run: |
          python3 - <<'PY'
          import base64, gzip, json
          import scan
          seal = scan.seal
          def compact(payload, public_key):
              raw = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode()
              packed = {'encoding': 'gzip+base64', 'data': base64.b64encode(gzip.compress(raw, mtime=0)).decode()}
              return seal(packed, public_key)
          scan.seal = compact
          raise SystemExit(scan.main())
          PY
      - name: Publish encrypted results only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          import scan
          folder = Path('sealed')
          encrypted = json.loads((folder / 'results.encrypted.json').read_text())
          assert set(encrypted) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert encrypted['format'] == scan.FORMAT
          assert encrypted['key_id'] == 'eb9eb4640058a447025460219c89d7f417f7bf9c148d4c56d669eaf92ade4d5b'
          assert len(base64.b64decode(encrypted['nonce'], validate=True)) == 12
          assert len(base64.b64decode(encrypted['wrapped_key'], validate=True)) == 384
          base64.b64decode(encrypted['ciphertext'], validate=True)
          summary = json.loads((folder / 'summary.json').read_text())
          assert set(summary) <= {'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice'}
          assert summary['run_id'] == os.environ['GITHUB_RUN_ID']
          scan.publish(encrypted, summary)
          print('Only encrypted reports and aggregate counters were published.')
          PY
