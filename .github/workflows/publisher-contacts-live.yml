name: Publisher Contacts - Encrypted Live Scan

on:
  push:
    branches: [lead-engine-activation, main]
    paths:
      - publisher_cloud/scan.py
      - publisher_cloud/test_scan.py
      - publisher_cloud/requirements.txt
      - publisher_cloud/seeds.txt
      - .github/workflows/publisher-contacts-live.yml
  workflow_dispatch:
    inputs:
      batch:
        description: Public seed batch (all scans the initial pool)
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem

permissions:
  contents: write

concurrency:
  group: publisher-contacts-encrypted-results
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
      REPORT_KEY_ID: c2c8ed00819e3c0e11ad2319b683927979f1c881cd67157eb7b0059cac246a39
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements.txt
      - name: Install and verify delivered operator PUBLIC key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          pem = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvsZCK8RIgYEX6Qo5CDX5
          x91ggNq2yGOW1E0nvexwMkS0d2KcLm5FywfqOBHBnGuuzdyhSvsqb99FyK7tL6H5
          nfl92YWY9kcXwZP1WL0Dci/PEuRLevHj+8rCmUvM6UV2Cr2BTSNifQkIPLycUREz
          bwfw5y/jm18crrHZ/1uN9/GePQrIVQ+WAU8uAn8Me5AZhybpU6LWXAIVvoCCGTX5
          zTLBO56Nf5n5QAk7BYqgzlD2QWmHO/oTknvcdn+Y9iEaNSrDcFOa7eyngc1iZx38
          sRkdYH02ECBQ/78Lnlfw58/n9jfd9eJa30nLlmVY+JMYJKGpfH+Wd4eOcWYydIIM
          pOBM0thXSAjSdwl3bPek6yjMBk4ECN68hXXhcmA/A/mMxO+KS6dxo5qPE/rfUlxR
          Es5e3vpSc2QHaVAGQw+IEfXAVjwyT9bL0tAdTrq+b5ny7VbHAjjLQ8n2lja2I22u
          4CX9Q/bMEWS2tGO1BANe8yK91bv6gfO6BpIz5GXdt62LAgMBAAE=
          -----END PUBLIC KEY-----
          '''
          key = serialization.load_pem_public_key(pem)
          assert isinstance(key, rsa.RSAPublicKey) and key.key_size >= 3072
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == os.environ['REPORT_KEY_ID']
          Path('recipient.pem').write_bytes(pem)
          print('Operator public key validated. No private key on runner.')
          PY
      - name: Test extraction, URL guards, CSV safety and encryption
        run: python3 -m unittest -v test_scan
      - name: Scan public websites without repository credentials
        run: python3 scan.py
      - name: Publish only validated encrypted output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, base64, os
          from scan import publish, FORMAT
          envelope = json.loads(Path('sealed/results.encrypted.json').read_text())
          summary = json.loads(Path('sealed/summary.json').read_text())
          assert set(envelope) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert envelope['format'] == FORMAT
          assert envelope['key_id'] == os.environ['REPORT_KEY_ID']
          assert len(base64.b64decode(envelope['nonce'], validate=True)) == 12
          assert len(base64.b64decode(envelope['wrapped_key'], validate=True)) == 384
          base64.b64decode(envelope['ciphertext'], validate=True)
          publish(envelope, summary)
          print('Encrypted results published; no plaintext contact export uploaded.')
          PY
      - name: Downloadable encrypted results (no key or plaintext)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publisher-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publisher_cloud/sealed/results.encrypted.json
            publisher_cloud/sealed/summary.json
          if-no-files-found: error
          retention-days: 7
