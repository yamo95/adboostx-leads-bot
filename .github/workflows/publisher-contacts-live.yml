name: Publisher Contacts - Encrypted Live Scan

on:
  push:
    branches: [main]
    paths:
      - publisher_cloud/scan.py
      - publisher_cloud/test_scan.py
      - publisher_cloud/requirements.txt
      - publisher_cloud/seeds.txt
      - publisher_cloud/recipient.pem
      - .github/workflows/publisher-contacts-live.yml
  workflow_dispatch:
    inputs:
      batch:
        description: Public seed batch (all scans the full initial pool)
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem

permissions:
  contents: write

concurrency:
  group: publisher-production-results
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements.txt
      - name: Confirm results match the delivered private viewer
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          key = serialization.load_pem_public_key(Path('recipient.pem').read_bytes())
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          expected = 'c9e3f3d8632721e745a43f81c58b8d334feb79d80a242386e25a7b33fbf9e267'
          if hashlib.sha256(der).hexdigest() != expected:
              raise SystemExit('Recovery key changed. Update the operator viewer before scanning.')
          print('Delivered recovery-key fingerprint matched.')
          PY
      - name: Test URL safety, extraction, CSV safety and encryption
        run: python3 -m unittest -v test_scan
      - name: Scan public websites and publish encrypted snapshots only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scan.py --publish
      - name: Retain encrypted results and public source only
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publisher-scan-${{ github.run_id }}
          path: |
            publisher_cloud/sealed/*.json
            publisher_cloud/scan.py
            publisher_cloud/test_scan.py
            publisher_cloud/requirements.txt
            publisher_cloud/seeds.txt
            publisher_cloud/recipient.pem
            publisher_cloud/leadengine/*.py
          retention-days: 7
          if-no-files-found: error
