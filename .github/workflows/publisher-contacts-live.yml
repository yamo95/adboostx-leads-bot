name: Publisher Contacts - Encrypted Live Scan

on:
  push:
    branches: [main]
    paths:
      - publisher_cloud/scan.py
      - publisher_cloud/test_scan.py
      - publisher_cloud/requirements.txt
      - publisher_cloud/seeds.txt
      - .github/workflows/publisher-contacts-live.yml
  workflow_dispatch:
    inputs:
      batch:
        description: Public seed batch
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: write
concurrency:
  group: publisher-production-results
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements.txt
      - name: Verify private contact desk public key
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          raw = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAl89BSsuJNJX63Tvo+dV8
          xZuItgakLlsofifPcJwznso1lsRsczNf74H3JYkXp5B10ud8dCXx9EA9HOnbLalI
          e+pu5nUpkC8vsKyhbQ5ysAq6Ap7UvYtHzErvffQ1c0QPMPyusgBjYYwquKAsb/QX
          swjecAO/BFSO/MwnkSfjotFN6kjmPa8LZUSxXHQMniT5DkUVTvWu/5AILc12s3qa
          UGr4fEEMW8mJD2AjobJsn0LzIPMGi+Iiw9EZTKIT+ZrEul0nvy1/kq4rCxdHoWbt
          wi+hXmk+HO1D1gYN1acVnWfelLYuDQZhN5rEIhVGqi4zqFm+tQPzMF23g6OQsQgf
          4TVSYrqa6iZ+6Qn4IuF+mkCMEhoffgehUEXkeSS90pj8zkfm/4yxdPNRjZxhwzvR
          HTBNfZP5AzR1lJaUXrjmd05iVtr/1zsaYsGloJkBVI4fofTaLfo3V+bpvJ3aZ14Q
          jYfz9IWHlfVeTL8N0j4VAcm3PT5nzXEoKKt8KZJL2R5fAgMBAAE=
          -----END PUBLIC KEY-----
          '''
          key = serialization.load_pem_public_key(raw)
          assert isinstance(key, rsa.RSAPublicKey) and key.key_size == 3072
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == '62823c12a92dc0b2615b7de4d1dc208085cd427049e850be798929196db7c5d9'
          Path('recipient.pem').write_bytes(raw)
          print('Private contact desk public key verified. No private key is on the runner.')
          PY
      - name: Test extraction and encryption
        run: python3 -m unittest -v test_scan
      - name: Scan and encrypt without repository credentials
        run: python3 scan.py
      - name: Publish encrypted results only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          import scan
          folder = Path('sealed')
          encrypted = json.loads((folder / 'results.encrypted.json').read_text())
          assert set(encrypted) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert encrypted['format'] == scan.FORMAT
          assert encrypted['key_id'] == '62823c12a92dc0b2615b7de4d1dc208085cd427049e850be798929196db7c5d9'
          assert len(base64.b64decode(encrypted['nonce'], validate=True)) == 12
          assert len(base64.b64decode(encrypted['wrapped_key'], validate=True)) == 384
          assert len(base64.b64decode(encrypted['ciphertext'], validate=True)) >= 16
          summary = json.loads((folder / 'summary.json').read_text())
          assert set(summary) <= {'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice'}
          assert summary['run_id'] == os.environ['GITHUB_RUN_ID']
          for name in ('seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites'):
              assert type(summary[name]) is int and summary[name] >= 0
          scan.publish(encrypted, summary)
          print('Encrypted results published. No plaintext contacts uploaded.')
          PY
      - name: Retain encrypted acceptance report and public source
        if: ${{ always() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publisher-delivery-${{ github.run_id }}
          path: |
            publisher_cloud/scan.py
            publisher_cloud/test_scan.py
            publisher_cloud/requirements.txt
            publisher_cloud/seeds.txt
            publisher_cloud/leadengine/*.py
            publisher_cloud/sealed/*.json
          retention-days: 3
          if-no-files-found: error
