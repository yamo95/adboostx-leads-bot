name: Publisher Contacts - Encrypted Live Scan

on:
  push:
    branches: [main]
    paths:
      - publisher_cloud/scan.py
      - publisher_cloud/test_scan.py
      - publisher_cloud/requirements.txt
      - publisher_cloud/seeds.txt
      - publisher_cloud/operator-public.pem
      - .github/workflows/publisher-contacts-live.yml
  workflow_dispatch:
    inputs:
      batch:
        description: Public seed batch (all scans the full initial pool)
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem

permissions:
  contents: write

concurrency:
  group: publisher-production-results
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements.txt
      - name: Verify backed-up operator public key
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          pem = Path('operator-public.pem').read_bytes()
          key = serialization.load_pem_public_key(pem)
          assert isinstance(key, rsa.RSAPublicKey) and key.key_size >= 3072
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == 'b16696094dff4a886a844afa24b7fb036f60e3516da8b045135ff7d29a619393'
          Path('recipient.pem').write_bytes(pem)
          print('Operator public-key fingerprint matched. No private key is on the runner.')
          PY
      - name: Test extraction, URL guards, CSV safety and encryption
        run: python3 -m unittest -v test_scan
      - name: Scan public websites without repository credentials
        run: python3 scan.py
      - name: Publish validated encrypted output only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          import scan
          envelope = json.loads(Path('sealed/results.encrypted.json').read_text())
          summary = json.loads(Path('sealed/summary.json').read_text())
          assert set(envelope) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert envelope['format'] == scan.FORMAT
          assert envelope['key_id'] == 'b16696094dff4a886a844afa24b7fb036f60e3516da8b045135ff7d29a619393'
          assert len(base64.b64decode(envelope['nonce'], validate=True)) == 12
          assert len(base64.b64decode(envelope['wrapped_key'], validate=True)) == 384
          assert len(base64.b64decode(envelope['ciphertext'], validate=True)) >= 16
          assert set(summary) <= {'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice'}
          assert summary['run_id'] == __import__('os').environ['GITHUB_RUN_ID']
          scan.publish(envelope, summary)
          print('Encrypted results published; contact values are not public.')
          PY
      - name: Retain encrypted results and public source only
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publisher-scan-${{ github.run_id }}
          path: |
            publisher_cloud/sealed/*.json
            publisher_cloud/scan.py
            publisher_cloud/test_scan.py
            publisher_cloud/requirements.txt
            publisher_cloud/seeds.txt
            publisher_cloud/operator-public.pem
            publisher_cloud/leadengine/*.py
          retention-days: 3
          if-no-files-found: error
