name: Publisher Desk - Confirmed
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/publisher-confirmed.yml']
  workflow_dispatch:
    inputs:
      batch:
        description: Seed batch
        type: choice
        options: [all, auto, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: write
  actions: write
concurrency:
  group: publisher-confirmed
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
    steps:
      - name: Checkout the source that passed a real cloud scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 666ae44a6a7d4179a10fb5aec3571efa1cc7742f
      - name: Disable only superseded publisher-task workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          own = '.github/workflows/publisher-confirmed.yml'
          def api(method, endpoint):
              p = subprocess.run(['gh','api','--method',method,'repos/'+repo+'/'+endpoint], capture_output=True, text=True)
              if p.returncode:
                  raise RuntimeError('GitHub workflow-management request failed')
              return json.loads(p.stdout) if p.stdout.strip() else None
          def related(w):
              name = w['path'].rsplit('/',1)[-1]
              return name.startswith(('publisher-','contact-desk-','admaven-operator-')) or name == 'lead-engine-infrastructure-check.yml'
          inventory = api('GET','actions/workflows?per_page=100')['workflows']
          disabled, errors = [], []
          for w in inventory:
              if w['path'] != own and related(w) and w['state'] == 'active':
                  try:
                      api('PUT','actions/workflows/'+str(w['id'])+'/disable')
                      disabled.append(w['id'])
                  except RuntimeError:
                      errors.append(w['path'])
          running = api('GET','actions/runs?status=in_progress&per_page=100')['workflow_runs']
          for r in running:
              if r['workflow_id'] in disabled and str(r['id']) != os.environ['GITHUB_RUN_ID']:
                  try: api('POST','actions/runs/'+str(r['id'])+'/cancel')
                  except RuntimeError: pass
          remaining = [w['path'] for w in api('GET','actions/workflows?per_page=100')['workflows'] if related(w) and w['state'] == 'active']
          report = {'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':'666ae44a6a7d4179a10fb5aec3571efa1cc7742f','active_publisher_workflows':remaining,'disabled_count':len(disabled),'management_errors':errors,'schedule':'09:00 and 18:00 Asia/Jerusalem','mode':'bounded_keyless_discovery','private_key_on_runner':False}
          Path('sealed').mkdir(exist_ok=True)
          Path('sealed/deployment.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt email-validator==2.3.0
      - name: Bind public encryption key; private key stays with the owner
        run: |
          cat > viewer-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAj0u31ILeHivybQApqmb8
          VLVEmveeYcZaBonYyg6j4YlraA3lEeczEOfXPH9b1fJu1mkRdFGTAvGBSCtt17we
          jjTZSJg5Hpt3S4oxx7z1THIFunowWV58Hd5jaTR+vNw0fkABmXJzep2dft2BKRmb
          Sv8VKVZPyFm5Sd73PI7UWu97HfcjztClqO0pyK76aPsL5pRCJVh1xTdMpJ/KzOla
          31xfh8D0bhiUVsLELD8Qeiv3P6QFZlS74+aagtWfC12lbTte0fmgSHEXJ2QFXo4T
          r3TOqPx6UEfx7fEcSA1CIwSr6JRAKJeZ/ME2qs2jotBIKoMxeEUvH5Ury2DPkVDh
          6QSGC9f281/qy59YPgsorRvOZyz8FSfZdlc+Q7gJZj9c0Znl/tpRInX9oqmZXZSk
          l1u9z+PhOkCgKfjyVBonDVUJ18WGPEql9OnRUSU48jm+ck9R1DU1hZV+37WUtOjc
          fP9xtQJAdJcbZVehEfus07hSSnbBWDlTx19uvwJwCdsvAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          cp viewer-public.pem recipient.pem
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          key = serialization.load_pem_public_key(Path('viewer-public.pem').read_bytes())
          der = key.public_bytes(serialization.Encoding.DER,serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == 'b5732a5acc1a91fb0b2241dfa37ddd97b1e33a7d9b6f362d4f15c2339618b015'
          PY
      - name: Test parsing, contact attribution and encryption
        run: python3 -m unittest -v test_scan test_delivery
      - name: Run live discovery and scan without repository credentials
        run: python3 delivery.py
      - name: Publish encrypted results and aggregate counters
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          from pathlib import Path
          import scan
          envelope = json.loads(Path('sealed/results.encrypted.json').read_text())
          summary = json.loads(Path('sealed/summary.json').read_text())
          assert set(envelope) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert envelope['format'] == scan.FORMAT
          assert envelope['key_id'] == 'b5732a5acc1a91fb0b2241dfa37ddd97b1e33a7d9b6f362d4f15c2339618b015'
          assert len(base64.b64decode(envelope['nonce'],validate=True)) == 12
          assert len(base64.b64decode(envelope['wrapped_key'],validate=True)) == 384
          assert len(base64.b64decode(envelope['ciphertext'],validate=True)) >= 16
          allowed = {'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice','messaging_routes_on_relevant_sites','messaging_by_channel','discovery_api_attempts','discovery_api_successes','discovery_candidates','parsing'}
          assert set(summary) <= allowed and summary['run_id'] == os.environ['GITHUB_RUN_ID']
          rid = os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          assert re.fullmatch(r'[0-9-]+',rid)
          prefix = 'publisher-confirmed-results/'
          def write(path, obj):
              old = scan.gh('GET','contents/'+path+'?ref=main')
              data = {'branch':'main','message':'Update encrypted publisher results '+rid,'content':base64.b64encode(json.dumps(obj).encode()).decode()}
              if old: data['sha'] = old['sha']
              scan.gh('PUT','contents/'+path,data)
          path = prefix+'runs/'+rid+'.json'
          write(path,envelope)
          old = scan.gh('GET','contents/'+prefix+'index.json?ref=main')
          index = json.loads(base64.b64decode(old['content'])) if old else {'format':1,'runs':[]}
          index['runs'] = [{'path':path,'key_id':envelope['key_id'],'summary':summary}] + [x for x in index['runs'] if x['path'] != path][:59]
          index['updated_at'] = scan.stamp()
          index['notice'] = 'Encrypted research snapshots. Only the owner-held viewer can decrypt. Historical ciphertext remains in Git history.'
          write(prefix+'index.json',index)
          report = json.loads(Path('sealed/deployment.json').read_text())
          # Check public browser access without sending any repository credentials.
          url = 'https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/main/'+path
          req = urllib.request.Request(url,headers={'Origin':'null','User-Agent':scan.UA})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  fetched = json.load(response)
                  report['public_results_fetch'] = response.status
                  report['cors_allow_origin'] = response.headers.get('Access-Control-Allow-Origin','')
                  assert fetched['key_id'] == envelope['key_id']
          except Exception as error:
              report['public_fetch_error'] = type(error).__name__
          Path('sealed/deployment.json').write_text(json.dumps(report,indent=2))
          write(prefix+'deployment.json',report)
          print(json.dumps(summary,indent=2))
          print(json.dumps(report,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Publisher Desk\n\nReal live scan completed; outputs are encrypted. No messages were sent.\n\n```json\n'+json.dumps(summary,indent=2)+'\n```\n')
          PY
      - name: Retain encrypted results for acceptance testing
        if: ${{ always() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publisher-confirmed-${{ github.run_id }}
          path: publisher_cloud/sealed/*.json
          retention-days: 3
          if-no-files-found: error
