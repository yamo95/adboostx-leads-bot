name: Private Contact Desk 62823

on:
  push:
    branches: [main]
    paths: [.github/workflows/contact-desk-62823.yml]
  workflow_dispatch:
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem

permissions:
  contents: write
concurrency:
  group: private-contact-desk-62823
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || 'all' }}
    steps:
      - name: Check out the reviewed runtime, isolated from parallel edits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 59c457ff7a159f5402c584807d1095a61ee24756
          persist-credentials: false
      - name: Install pinned runtime dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Set the public encryption key matching the private desk
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          raw = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAl89BSsuJNJX63Tvo+dV8
          xZuItgakLlsofifPcJwznso1lsRsczNf74H3JYkXp5B10ud8dCXx9EA9HOnbLalI
          e+pu5nUpkC8vsKyhbQ5ysAq6Ap7UvYtHzErvffQ1c0QPMPyusgBjYYwquKAsb/QX
          swjecAO/BFSO/MwnkSfjotFN6kjmPa8LZUSxXHQMniT5DkUVTvWu/5AILc12s3qa
          UGr4fEEMW8mJD2AjobJsn0LzIPMGi+Iiw9EZTKIT+ZrEul0nvy1/kq4rCxdHoWbt
          wi+hXmk+HO1D1gYN1acVnWfelLYuDQZhN5rEIhVGqi4zqFm+tQPzMF23g6OQsQgf
          4TVSYrqa6iZ+6Qn4IuF+mkCMEhoffgehUEXkeSS90pj8zkfm/4yxdPNRjZxhwzvR
          HTBNfZP5AzR1lJaUXrjmd05iVtr/1zsaYsGloJkBVI4fofTaLfo3V+bpvJ3aZ14Q
          jYfz9IWHlfVeTL8N0j4VAcm3PT5nzXEoKKt8KZJL2R5fAgMBAAE=
          -----END PUBLIC KEY-----
          '''
          key = serialization.load_pem_public_key(raw)
          assert isinstance(key, rsa.RSAPublicKey) and key.key_size == 3072
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == '62823c12a92dc0b2615b7de4d1dc208085cd427049e850be798929196db7c5d9'
          Path('recipient.pem').write_bytes(raw)
          print('Public encryption key matches the delivered private desk.')
          PY
      - name: Test parsing, network guards, CSV safety and encryption
        run: python3 -m unittest -v test_scan
      - name: Scan public pages and encrypt without repository credentials
        run: python3 scan.py
      - name: Publish ciphertext and aggregate counters into isolated result storage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, time, re
          from pathlib import Path
          import scan
          folder = Path('sealed')
          env = json.loads((folder / 'results.encrypted.json').read_text())
          stats = json.loads((folder / 'summary.json').read_text())
          assert set(env) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert env['format'] == scan.FORMAT
          assert env['key_id'] == '62823c12a92dc0b2615b7de4d1dc208085cd427049e850be798929196db7c5d9'
          assert len(base64.b64decode(env['nonce'], validate=True)) == 12
          assert len(base64.b64decode(env['wrapped_key'], validate=True)) == 384
          assert len(base64.b64decode(env['ciphertext'], validate=True)) >= 16
          allowed = {'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice'}
          assert set(stats) <= allowed and stats['run_id'] == os.environ['GITHUB_RUN_ID']
          for name in ('seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites'):
              assert type(stats[name]) is int and stats[name] >= 0
          rid = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          assert re.fullmatch(r'[0-9-]+', rid)
          path = 'contact-desk-62823/runs/' + rid + '.json'
          def put(path, make):
              for attempt in range(4):
                  old = scan.gh('GET', 'contents/' + path + '?ref=main')
                  before = json.loads(base64.b64decode(old['content'])) if old else None
                  value = make(before)
                  body = {'message':'Update isolated encrypted contact desk '+rid,'branch':'main','content':base64.b64encode(json.dumps(value).encode()).decode()}
                  if old: body['sha'] = old['sha']
                  try:
                      scan.gh('PUT','contents/'+path,body)
                      return
                  except RuntimeError:
                      if attempt == 3: raise
                      time.sleep(2 + attempt)
          put(path, lambda old: env)
          def index(old):
              old = old or {'format':1,'runs':[]}
              old['runs'] = [{'path':path,'summary':stats}] + [r for r in old['runs'] if r['path'] != path]
              old['runs'] = old['runs'][:60]
              old['updated_at'] = scan.stamp()
              old['key_id'] = env['key_id']
              old['note'] = 'Encrypted snapshots. Key is held only by the operator. Index pruning does not erase Git history.'
              return old
          put('contact-desk-62823/index.json', index)
          print('Isolated encrypted contact desk updated. No plaintext contacts published.')
          PY
      - name: Preserve encrypted acceptance artifact and reviewed public source
        if: ${{ always() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: private-contact-desk-62823-${{ github.run_id }}
          path: |
            publisher_cloud/scan.py
            publisher_cloud/test_scan.py
            publisher_cloud/requirements.txt
            publisher_cloud/seeds.txt
            publisher_cloud/leadengine/*.py
            publisher_cloud/sealed/*.json
          retention-days: 3
          if-no-files-found: error
