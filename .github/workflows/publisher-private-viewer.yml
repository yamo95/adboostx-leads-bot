name: Publisher Contact Desk
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publisher-private-viewer.yml
      - publisher_cloud/recipient-5488485b.pem
  workflow_dispatch:
    inputs:
      batch:
        description: Public seed batch
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: write
concurrency:
  group: publisher-production-results
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install and test runtime
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest -v test_scan
      - name: Configure user-delivered recovery public key
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          raw = Path('recipient-5488485b.pem').read_bytes()
          key = serialization.load_pem_public_key(raw)
          assert isinstance(key, rsa.RSAPublicKey) and key.key_size == 3072
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == '5488485b9b67dc013433652cabb933f69f22fcfdbc3d585d0773f4a760ca564c'
          Path('recipient.pem').write_bytes(raw)
          print('Operator backup fingerprint matched. The private key is not on the runner.')
          PY
      - name: Scan public sources without repository credentials
        run: python3 scan.py
      - name: Publish encrypted report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          import scan
          encrypted = json.loads(Path('sealed/results.encrypted.json').read_text())
          summary = json.loads(Path('sealed/summary.json').read_text())
          assert set(encrypted) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert encrypted['format'] == scan.FORMAT
          assert encrypted['key_id'] == '5488485b9b67dc013433652cabb933f69f22fcfdbc3d585d0773f4a760ca564c'
          assert len(base64.b64decode(encrypted['nonce'], validate=True)) == 12
          assert len(base64.b64decode(encrypted['wrapped_key'], validate=True)) == 384
          assert len(base64.b64decode(encrypted['ciphertext'], validate=True)) >= 16
          assert summary['run_id'] == os.environ['GITHUB_RUN_ID']
          assert set(summary) <= {'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice'}
          scan.publish(encrypted, summary)
          print('Published encrypted report and aggregate counts only.')
          PY
      - name: Keep encrypted acceptance report
        if: ${{ always() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-contact-desk-${{ github.run_id }}
          path: |
            publisher_cloud/sealed/*.json
            publisher_cloud/scan.py
            publisher_cloud/test_scan.py
            publisher_cloud/requirements.txt
            publisher_cloud/seeds.txt
          retention-days: 3
          if-no-files-found: error
