name: Publisher Desk - Production
'on':
  push:
    branches: [main]
    paths: ['publisher_cloud/delivery.py','publisher_cloud/test_delivery.py','publisher_cloud/recipient-0d32ffa2.pem','.github/workflows/publisher-desk-production.yml']
  workflow_dispatch:
    inputs:
      batch:
        description: Seed batch
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: write
  actions: write
concurrency:
  group: publisher-desk-production
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Disable superseded duplicate lead-scanning workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for old in admaven-operator-b1669609.yml contact-desk-62823.yml publisher-contacts-live.yml publisher-contacts-operational.yml publisher-delivery-143e7625.yml publisher-operator-06627b.yml publisher-private-viewer.yml publisher-private-workspace.yml; do
            state=$(gh api "repos/yamo95/adboostx-leads-bot/actions/workflows/$old" --jq '.state')
            if [ "$state" = active ]; then
              gh api --method PUT "repos/yamo95/adboostx-leads-bot/actions/workflows/$old/disable"
              printf 'Disabled duplicate workflow: %s\n' "$old"
            else
              printf 'Already inactive: %s (%s)\n' "$old" "$state"
            fi
          done
      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt email-validator==2.3.0
      - name: Bind delivered viewer public key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          raw = Path('recipient-0d32ffa2.pem').read_bytes()
          key = serialization.load_pem_public_key(raw)
          assert isinstance(key, rsa.RSAPublicKey) and key.key_size == 3072
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == '0d32ffa20b873f7bff683a7193da8da42a65ba0d2fba4f604c5c880dc351aa85'
          Path('viewer-public.pem').write_bytes(raw)
          print('Public key bound. Private key is not present on this runner.')
          PY
      - name: Test extraction, channel attribution and encryption
        run: python3 -m unittest -v test_scan test_delivery
      - name: Discover and scan without repository credentials
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import delivery, scan
          seal_full = delivery.corrected_seal
          def seal_with_acceptance(payload, unused):
              encrypted = seal_full(payload, unused)
              sample = [c for c in payload['contacts'] if c['channel'] in {'telegram','whatsapp'} and c.get('site_fit') == 'PASS' and c.get('quality') in {'PUBLISHED_BUSINESS_ROUTE','PUBLISHED_GENERAL_ROUTE'}][:3]
              preview = {'summary':payload['summary'],'contacts':sample,'sites':[],'files':{},'notice':'Acceptance sample only, not the complete report.'}
              out = Path('sealed'); out.mkdir(exist_ok=True)
              out.joinpath('acceptance.encrypted.json').write_text(json.dumps(delivery.BASE_SEAL(preview, Path('viewer-public.pem').read_bytes())), encoding='utf-8')
              return encrypted
          delivery.corrected_seal = seal_with_acceptance
          raise SystemExit(delivery.main())
          PY
      - name: Publish encrypted results and aggregate counters only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re
          from pathlib import Path
          import scan
          expected = '0d32ffa20b873f7bff683a7193da8da42a65ba0d2fba4f604c5c880dc351aa85'
          def checked(path):
              e = json.loads(Path(path).read_text())
              assert set(e) == {'format','key_id','wrapped_key','nonce','ciphertext'}
              assert e['format'] == scan.FORMAT and e['key_id'] == expected
              assert len(base64.b64decode(e['nonce'], validate=True)) == 12
              assert len(base64.b64decode(e['wrapped_key'], validate=True)) == 384
              assert len(base64.b64decode(e['ciphertext'], validate=True)) >= 16
              return e
          envelope = checked('sealed/results.encrypted.json')
          acceptance = checked('sealed/acceptance.encrypted.json')
          summary = json.loads(Path('sealed/summary.json').read_text())
          allowed = {'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice','messaging_routes_on_relevant_sites','messaging_by_channel','discovery_api_attempts','discovery_api_successes','discovery_candidates','parsing'}
          assert set(summary) <= allowed and summary['run_id'] == os.environ['GITHUB_RUN_ID']
          rid = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          assert re.fullmatch(r'[0-9-]+', rid)
          def write(path, obj, message):
              old = scan.gh('GET','contents/'+path+'?ref=main')
              data = {'branch':'main','message':message,'content':base64.b64encode(json.dumps(obj).encode()).decode()}
              if old: data['sha'] = old['sha']
              scan.gh('PUT','contents/'+path,data)
          path = 'publisher-desk-results/runs/' + rid + '.json'
          write(path, envelope, 'Store encrypted publisher snapshot '+rid)
          write('publisher-desk-results/acceptance.json', acceptance, 'Store encrypted end-to-end acceptance sample '+rid)
          ipath = 'publisher-desk-results/index.json'
          old = scan.gh('GET','contents/'+ipath+'?ref=main')
          index = json.loads(base64.b64decode(old['content'])) if old else {'format':1,'runs':[]}
          index['runs'] = [{'path':path,'key_id':envelope['key_id'],'summary':summary}] + [r for r in index['runs'] if r['path'] != path][:59]
          index['updated_at'] = scan.stamp()
          index['note'] = 'Encrypted results only. Historical snapshots may require an earlier key. Deleting an index entry does not erase Git history.'
          write(ipath,index,'Refresh contact desk index '+rid)
          print(json.dumps(summary, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Publisher Desk\n\nEncrypted results were published successfully. No private key or plaintext contacts were uploaded.\n\n```json\n'+json.dumps(summary,indent=2)+'\n```\n')
          if summary['pages_opened'] == 0:
              raise SystemExit('No public pages were accessible; encrypted diagnostics published, but this is not a successful crawl.')
          PY
      - name: Retain encrypted acceptance report
        if: ${{ always() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contact-desk-${{ github.run_id }}
          path: publisher_cloud/sealed/*.json
          retention-days: 3
          if-no-files-found: warn
