name: Publisher Contact Service

on:
  push:
    branches: [main]
    paths: [.github/workflows/publisher-service-1cfba512.yml]
  workflow_dispatch:
    inputs:
      batch:
        description: Scan public seed batch
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '7 9,18 * * *'
      timezone: Asia/Jerusalem

permissions:
  contents: write
concurrency:
  group: publisher-service-1cfba512
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
      EXPECTED_KEY_ID: 1cfba5128851bb5720965c462d2557fdab4218cf246c1aa81eb9045f7ced0fd3
    steps:
      - name: Check out the reviewed immutable scanner revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3d4479c8fd2633995aa394fd10c8607b0c55d9ae
          persist-credentials: false
      - name: Source audit artifact (public code only)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publisher-source-audit
          path: |
            publisher_cloud/scan.py
            publisher_cloud/test_scan.py
            publisher_cloud/requirements.txt
            publisher_cloud/seeds.txt
          retention-days: 3
          if-no-files-found: error
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements.txt
      - name: Validate delivery encryption key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          pem = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAsoj5so1piW32SGJwDhLi
          eU05NAhUe/5myw4fTpjv0QmYgzZfL0uvLWwZ2UVpGh6Rp15FxwctUkWGCp+H0nC+
          DB4B8WLG7N3fzfjBEVIgRiynU9gPE1/rOHC+5j4lIjoIReYvvt48VyssEu9SCkiY
          k3wLJe6ZDuhoBiPcMDz5SeUVZ0rssCKmr8J8AclaTUjaeIrQsyCnZl4Fy2E055C1
          F0XLN9B4EWjqSNh4GOA+b9WB1L3PGR825lH3CvmfQnnWfRkjnimG+S9XTno9wNQQ
          asvYTbiHuvOEx3nNEjpATPCMGEUgWPxo5hpLZQdy8T9mXi0Szj8huwzuAc2cqXb6
          iND+QiQN1ZQqO0HmVRcGlvdHSh5MvMTNq3EvfhWF3xMKI+5p9C64sk1TPrx00P0y
          wkQvQFrev0+8FJ8w792v3LCoGxL1dgLDu6+b5MUa6VCY6fQ5l/ITMrrt3hvGsFJr
          Kq90gMo+6VVo++/wbacn6lkQv9+seFvtt93fayIEV8otAgMBAAE=
          -----END PUBLIC KEY-----
          '''
          public = serialization.load_pem_public_key(pem)
          assert isinstance(public, rsa.RSAPublicKey) and public.key_size == 3072
          der = public.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == os.environ['EXPECTED_KEY_ID']
          Path('recipient.pem').write_bytes(pem)
          print('Public key matches the privately delivered recovery key.')
          PY
      - name: Run regression tests
        run: python3 -m unittest -v test_scan
      - name: Live public-contact scan (no repository token)
        run: python3 scan.py
      - name: Preserve encrypted results and aggregate status
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publisher-encrypted-results
          path: |
            publisher_cloud/sealed/results.encrypted.json
            publisher_cloud/sealed/summary.json
          retention-days: 14
          if-no-files-found: warn
      - name: Publish ciphertext to the dedicated results namespace
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, os
          import scan
          envelope = json.loads(Path('sealed/results.encrypted.json').read_text())
          summary = json.loads(Path('sealed/summary.json').read_text())
          assert set(envelope) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert envelope['format'] == scan.FORMAT
          assert envelope['key_id'] == os.environ['EXPECTED_KEY_ID']
          assert len(base64.b64decode(envelope['nonce'], validate=True)) == 12
          assert len(base64.b64decode(envelope['wrapped_key'], validate=True)) == 384
          assert len(base64.b64decode(envelope['ciphertext'], validate=True)) > 16
          original = scan.gh
          def isolated(method, endpoint, payload=None):
              endpoint = endpoint.replace('publisher-results/', 'publisher-output-1cfba512/')
              if payload is not None and 'content' in payload and '/index.json' in endpoint:
                  index = json.loads(base64.b64decode(payload['content']))
                  for record in index['runs']:
                      record['path'] = record['path'].replace('publisher-results/', 'publisher-output-1cfba512/')
                  payload = dict(payload, content=base64.b64encode(json.dumps(index, indent=2).encode()).decode())
              return original(method, endpoint, payload)
          scan.gh = isolated
          scan.publish(envelope, summary)
          print('Published encrypted report; only aggregate counts are public.')
          PY
