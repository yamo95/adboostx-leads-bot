name: Lead Engine Infrastructure Check

on:
  push:
    branches: [lead-engine-activation]
    paths:
      - .github/workflows/lead-engine-infrastructure-check.yml
  workflow_dispatch:

permissions: {}

jobs:
  network-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Python and outbound HTTPS without credentials or publisher data
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import platform
          import socket
          import urllib.request
          endpoints = [
              ('package_registry', 'https://pypi.org/simple/'),
              ('public_github_api', 'https://api.github.com/'),
          ]
          results = []
          for label, url in endpoints:
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'LeadEngine-Infrastructure-Check/1.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      results.append({'check': label, 'status': response.status})
              except Exception as error:
                  results.append({'check': label, 'error_type': type(error).__name__})
          print(json.dumps({'python': platform.python_version(), 'checks': results}, indent=2))
          if any('error_type' in result for result in results):
              raise SystemExit(1)
          PY
