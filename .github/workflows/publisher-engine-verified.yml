name: Publisher Engine - Verified Encrypted Scan

on:
  push:
    branches: [main, publisher-engine-verified]
    paths:
      - publisher_engine_verified/**
      - .github/workflows/publisher-engine-verified.yml
  workflow_dispatch:
    inputs:
      batch:
        description: Seed batch (auto rotates morning and evening)
        type: choice
        options: [auto, '0', '1']
        default: auto
  schedule:
    - cron: '15 9,18 * * *'
      timezone: Asia/Jerusalem

permissions:
  contents: write

concurrency:
  group: publisher-engine-verified
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: publisher_engine_verified
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install runtime and regression tests
        run: python -m pip install -r requirements-dev.txt
      - name: Check all regression and privacy tests
        run: python -m pytest -q
      - name: Scan public sites without search keys or repository credentials
        id: scan
        env:
          SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || '1' }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/cloud_run.py
      - name: Publish only validated encrypted results
        if: ${{ always() && steps.scan.outcome != 'skipped' && github.ref_name == 'main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_snapshot.py
      - name: Keep encrypted download copy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-publisher-results-${{ github.run_id }}
          path: publisher_engine_verified/sealed/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
