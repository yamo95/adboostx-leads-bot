name: Private Publisher Desk
on:
  push:
    branches: [main, private-desk-7a68-delivery]
    paths: [.github/workflows/publisher-private-desk-7a68.yml]
  workflow_dispatch:
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: write
concurrency:
  group: private-publisher-desk-7a68
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || 'all' }}
      REPORT_KEY_ID: 7a68fb96824952ca435dbf3d5ce44bb19efe154b892a9ea36672be92b79e5017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3d4479c8fd2633995aa394fd10c8607b0c55d9ae
          persist-credentials: false
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements.txt
      - name: Preserve Telegram role boundaries and test them
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import asyncio
          target = Path('scan.py')
          code = target.read_text()
          old = "desc.get_text(' ',strip=True)"
          assert code.count(old) == 1
          target.write_text(code.replace(old, "desc.get_text('',strip=False)"))
          from scan import route, telegram_hops
          class Fixture:
              async def get(self, url, **kwargs):
                  if url.endswith('/ChannelDemo'):
                      return {'state':'ok','html':'<div class="tgme_page_extra">100 subscribers</div><div class="tgme_page_description">Support: <a>@HelpDemo</a><br>Advertising: <a>@AdsDemo</a><br>Our friend: <a>@FriendDemo</a></div>'}
                  return {'state':'ok','html':'<div>Send Message</div>'}
          start = route('https://t.me/ChannelDemo', 'Updates', 'https://publisher.example/contact')
          rows = asyncio.run(telegram_hops([start], Fixture()))
          by_contact = {row['contact']:row for row in rows}
          assert '@FriendDemo' not in by_contact
          assert by_contact['@HelpDemo']['role'] == 'support'
          assert by_contact['@AdsDemo']['role'] == 'business'
          assert by_contact['@AdsDemo']['via'] == 'https://publisher.example/contact'
          print('Additional regression passed: contact role boundaries and source chain.')
          PY
      - name: Validate PUBLIC report key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          from cryptography.hazmat.primitives import serialization
          pem = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAoIOTbb60nOGxsbT2w3Ss
          m8jFndhkp1J9Adb7Kcp8ntHEEE+xBDyhVm3mT3a0R0lgeNkfu2zfBxnvEaeI9Jsd
          Hna/Mktmc+ddclEexbat0SPlpQaEdKkAdNAnitK6jjF7Hs9IQqob5r2fTTFpWykF
          PvNjn2lEguvtdxU5feJzFknf4YGyzqSt98GEj4xrdv3zgSX7q6hDsJc6aj6VwTpz
          O4iG0D+MCRdpLhclXp12JvKo0vkY2JvAkN001+buYroOe5juQ/ZNCjqMMPSFPyJk
          udKlAWN2OT9VBLwCvD5qBWRER7Uo3b3sG2gRBck6rbEGTolkWqiXLAzbBuXadBGe
          sSvanwtePr6NWIoHVZJNQQfcbl7d/0ZeOnNnOt6gM9oIHUlKuwXLhs00U7SPCHlF
          Ri91d15AqCWPxhVQhorf6v1qJmQaQhrr0SM/csjaZOBOKVhvn2PEpT622wZ4KNDc
          sDI6MK76Zw6qeLZj9i4zAG7eIH3EiPa6sjmS1h7MjF8xAgMBAAE=
          -----END PUBLIC KEY-----
          '''
          key = serialization.load_pem_public_key(pem)
          assert key.key_size == 3072
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == os.environ['REPORT_KEY_ID']
          Path('recipient.pem').write_bytes(pem)
          print('Delivery public key validated. No private key uploaded.')
          PY
      - name: Run 25 core regression tests
        run: python3 -m unittest -v test_scan
      - name: Scan public contacts without repository credentials
        run: python3 scan.py
      - name: Preserve encrypted results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-desk-encrypted-${{ github.run_id }}
          path: |
            publisher_cloud/sealed/results.encrypted.json
            publisher_cloud/sealed/summary.json
          retention-days: 14
          if-no-files-found: warn
      - name: Publish ciphertext to isolated desk namespace
        if: success() && github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, os
          import scan
          envelope = json.loads(Path('sealed/results.encrypted.json').read_text())
          summary = json.loads(Path('sealed/summary.json').read_text())
          assert set(envelope) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert envelope['format'] == scan.FORMAT
          assert envelope['key_id'] == os.environ['REPORT_KEY_ID']
          assert len(base64.b64decode(envelope['nonce'], validate=True)) == 12
          assert len(base64.b64decode(envelope['wrapped_key'], validate=True)) == 384
          assert len(base64.b64decode(envelope['ciphertext'], validate=True)) > 16
          assert set(summary) <= {'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice'}
          original = scan.gh
          def isolated(method, endpoint, payload=None):
              endpoint = endpoint.replace('publisher-results/', 'publisher-desk-7a68/')
              if payload is not None and 'content' in payload and '/index.json' in endpoint:
                  index = json.loads(base64.b64decode(payload['content']))
                  for record in index['runs']:
                      record['path'] = record['path'].replace('publisher-results/', 'publisher-desk-7a68/')
                  payload = dict(payload, content=base64.b64encode(json.dumps(index, indent=2).encode()).decode())
              return original(method, endpoint, payload)
          scan.gh = isolated
          scan.publish(envelope, summary)
          print('Private desk report published as ciphertext only.')
          PY
