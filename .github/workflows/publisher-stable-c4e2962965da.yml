name: Publisher Desk - Delivered Stable
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/publisher-stable-c4e2962965da.yml']
  workflow_dispatch:
    inputs:
      batch:
        description: Seed batch
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: write
  actions: write
concurrency:
  group: publisher-delivered-c4e2962965da
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 666ae44a6a7d4179a10fb5aec3571efa1cc7742f
          persist-credentials: false
      - name: Disable superseded contact-desk workflows only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for old in 353412778 353402109; do
            state=$(gh api "repos/yamo95/adboostx-leads-bot/actions/workflows/$old" --jq '.state')
            if [ "$state" = active ]; then
              gh api --method PUT "repos/yamo95/adboostx-leads-bot/actions/workflows/$old/disable"
            fi
          done
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements.txt email-validator==2.3.0
      - name: Bind public key matching delivered private backup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          from cryptography.hazmat.primitives import serialization
          raw = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA95KVyQn7FHRmpQ+wruOe
          fBBdSVYrREWpufQLUfP2JUSoKqKFb7A4fcMbmjEs8mLJY71vkoOkzawT+a2koibn
          88KAPeVVgLYcPtksrb7c20ENvoJPo/0N+PGQW+6d05vBbyGwyDLnSlGxvD+AU1dk
          Liw2/LPCXOQ295CmB1IDY4sL/rvT0iRDXGrMdccQhKaJj0TU4Sz8qblM6PDaSI94
          L02xJspofDbbiC6ShvEUuBI0sfV46xXVyZidNaCkogpM+1c2HpvAGDQPRsEq1TnD
          +2hd3mhuBnwNEDJTrlPwA65Jd0ydn2PYbUpfQIqdYzb2X/kuZPa5LFX4rbPw04B/
          k/PiQHm3nT7XiBrF1Lpyrrd0L/g0a1K9oHeUMfCIKsNeAPlO+KdnuFWyrEKJqGSQ
          OCQzha6ova4zK0mwACFNuQXjLx9+PhtprHNiWgGXSRJLZAL793vYl1VcD3EXtc8i
          tooWkIFQ0b+8bzOarbg3TskeNamNkMcqKzsSlNzFPUafAgMBAAE=
          -----END PUBLIC KEY-----
          '''
          key = serialization.load_pem_public_key(raw)
          der = key.public_bytes(serialization.Encoding.DER,serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == 'c4e2962965dafad528cb9a70b67dea727a4ae28fe082fcc18203c30100f0ee1c'
          Path('viewer-public.pem').write_bytes(raw)
          print('Delivered viewer public key verified. No private key is on the runner.')
          PY
      - name: Verify extraction, classification, attribution and encryption
        run: python3 -m unittest -v test_scan test_delivery
      - name: Discover and scan without repository credentials
        run: python3 delivery.py
      - name: Publish encrypted results to the delivered viewer only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,re
          from pathlib import Path
          import scan
          e=json.loads(Path('sealed/results.encrypted.json').read_text())
          s=json.loads(Path('sealed/summary.json').read_text())
          expected='c4e2962965dafad528cb9a70b67dea727a4ae28fe082fcc18203c30100f0ee1c'
          assert set(e)=={'format','key_id','wrapped_key','nonce','ciphertext'}
          assert e['format']==scan.FORMAT and e['key_id']==expected
          assert len(base64.b64decode(e['nonce'],validate=True))==12
          assert len(base64.b64decode(e['wrapped_key'],validate=True))==384
          assert len(base64.b64decode(e['ciphertext'],validate=True))>=16
          allowed={'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice','messaging_routes_on_relevant_sites','messaging_by_channel','discovery_api_attempts','discovery_api_successes','discovery_candidates','parsing'}
          assert set(s)<=allowed and s['run_id']==os.environ['GITHUB_RUN_ID']
          rid=os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          assert re.fullmatch(r'[0-9-]+',rid)
          prefix='publisher-results-c4e2962965da/'
          def write(path,obj,message):
              old=scan.gh('GET','contents/'+path+'?ref=main')
              body={'branch':'main','message':message,'content':base64.b64encode(json.dumps(obj).encode()).decode()}
              if old:body['sha']=old['sha']
              scan.gh('PUT','contents/'+path,body)
          path=prefix+'runs/'+rid+'.json'
          write(path,e,'Store encrypted delivered-desk snapshot '+rid)
          old=scan.gh('GET','contents/'+prefix+'index.json?ref=main')
          index=json.loads(base64.b64decode(old['content'])) if old else {'format':1,'runs':[]}
          index['runs']=[{'path':path,'key_id':expected,'summary':s}]+[r for r in index['runs'] if r['path']!=path][:59]
          index['updated_at']=scan.stamp()
          index['note']='Encrypted snapshots. The private key is held by the user, not GitHub. Removing an index entry does not erase Git history.'
          write(prefix+'index.json',index,'Refresh delivered contact desk '+rid)
          print(json.dumps(s,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Delivered private contact desk\n\nEncrypted results published. No plaintext contact values or private keys uploaded.\n\n```json\n'+json.dumps(s,indent=2)+'\n```\n')
          PY
      - name: Retain encrypted acceptance report
        if: ${{ always() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: delivered-desk-${{ github.run_id }}
          path: publisher_cloud/sealed/*.json
          retention-days: 3
          if-no-files-found: warn
