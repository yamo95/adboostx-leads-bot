name: AdMaven Contacts - Operator

on:
  push:
    branches: [main]
    paths: [.github/workflows/admaven-operator-b1669609.yml]
  workflow_dispatch:
    inputs:
      batch:
        description: Public seed batch
        type: choice
        options: [auto, all, '0', '1']
        default: all
  schedule:
    - cron: '0 9,18 * * *'
      timezone: Asia/Jerusalem

permissions:
  contents: write
concurrency:
  group: admaven-operator-b1669609
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'yamo95/adboostx-leads-bot' && github.ref_name == 'main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher_cloud
    env:
      PYTHONUNBUFFERED: '1'
      SEED_BATCH: ${{ github.event_name == 'schedule' && 'auto' || inputs.batch || 'all' }}
    steps:
      - name: Check out the tested scanner revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 977288e0b5ed19ac99857bebeb5a0e52f64f317e
          persist-credentials: false
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements.txt
      - name: Verify the operator public key
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          pem = Path('operator-public.pem').read_bytes()
          key = serialization.load_pem_public_key(pem)
          assert isinstance(key, rsa.RSAPublicKey) and key.key_size >= 3072
          der = key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          assert hashlib.sha256(der).hexdigest() == 'b16696094dff4a886a844afa24b7fb036f60e3516da8b045135ff7d29a619393'
          Path('recipient.pem').write_bytes(pem)
          print('Public recipient matched the private operator backup.')
          PY
      - name: Preserve Telegram role boundaries and run regression check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import asyncio
          path = Path('scan.py')
          source = path.read_text()
          old = "desc.get_text(' ',strip=True)"
          assert source.count(old) == 1, 'Unexpected scanner revision'
          path.write_text(source.replace(old, "desc.get_text(' ',strip=False)"))
          import scan
          class PreviewFixture:
              async def get(self, url, **kwargs):
                  if url == 'https://t.me/OpsChannel':
                      html = '<div class="tgme_page_extra">200 subscribers</div><div class="tgme_page_description">Support: @OpsSupport<br>Advertising: @OpsAds<br>News: @OpsNews</div>'
                  else:
                      html = '<div class="tgme_page_extra">Public contact</div><p>If you have Telegram, you can contact this account.</p>'
                  return {'state':'ok','html':html}
          start = scan.route('https://t.me/OpsChannel','Our channel','https://publisher.example/contact')
          items = asyncio.run(scan.telegram_hops([start], PreviewFixture()))
          roles = {item['contact']:item['role'] for item in items}
          assert roles['@OpsSupport'] == 'support'
          assert roles['@OpsAds'] == 'business'
          assert '@OpsNews' not in roles
          print('Role-boundary regression passed; support, ads and news are separate.')
          PY
      - name: Run extraction and encryption tests
        run: python3 -m unittest -v test_scan
      - name: Scan without repository credentials
        run: python3 scan.py
      - name: Publish encrypted results with conflict-safe index updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, time
          from pathlib import Path
          import scan
          env = json.loads(Path('sealed/results.encrypted.json').read_text())
          summary = json.loads(Path('sealed/summary.json').read_text())
          assert set(env) == {'format','key_id','wrapped_key','nonce','ciphertext'}
          assert env['format'] == scan.FORMAT
          assert env['key_id'] == 'b16696094dff4a886a844afa24b7fb036f60e3516da8b045135ff7d29a619393'
          assert len(base64.b64decode(env['nonce'], validate=True)) == 12
          assert len(base64.b64decode(env['wrapped_key'], validate=True)) == 384
          assert len(base64.b64decode(env['ciphertext'], validate=True)) >= 16
          assert set(summary) <= {'created_at','run_id','seed_pool','seeds_scanned','sites_checked','pages_opened','contact_evidence_records','published_messaging_routes','relevant_sites','access_states','status','mode','notice'}
          assert summary['run_id'] == os.environ['GITHUB_RUN_ID']
          rid = os.environ['GITHUB_RUN_ID'] + '-' + os.getenv('GITHUB_RUN_ATTEMPT','1')
          assert re.fullmatch(r'[0-9-]+', rid)
          prefix = 'operator-results-b1669609/'
          path = prefix + 'runs/' + rid + '.json'
          def update(path, make_content):
              for attempt in range(6):
                  old = scan.gh('GET', 'contents/' + path + '?ref=main')
                  previous = json.loads(base64.b64decode(old['content'])) if old else None
                  text = json.dumps(make_content(previous), indent=2)
                  payload = {'message':'Update encrypted operator scan ' + rid, 'branch':'main', 'content':base64.b64encode(text.encode()).decode()}
                  if old: payload['sha'] = old['sha']
                  try:
                      scan.gh('PUT', 'contents/' + path, payload)
                      return
                  except RuntimeError as error:
                      if 'HTTP 409' not in str(error) or attempt == 5: raise
                      time.sleep(2 ** attempt)
          update(path, lambda previous: env)
          def merge(previous):
              index = previous or {'format':1, 'runs':[]}
              rows = [row for row in index.get('runs',[]) if row.get('path') != path]
              rows.append({'path':path,'key_id':env['key_id'],'summary':summary})
              rows.sort(key=lambda row:row.get('summary',{}).get('created_at',''), reverse=True)
              return {'format':1,'updated_at':scan.stamp(),'runs':rows[:60],
                  'notice':'Encrypted results. Older ciphertext can remain in Git history. The private key is never uploaded.'}
          update(prefix + 'index.json', merge)
          print('Operator ciphertext and aggregate-only index saved successfully.')
          PY
      - name: Save encrypted acceptance artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: admaven-operator-${{ github.run_id }}
          path: |
            publisher_cloud/sealed/*.json
            publisher_cloud/scan.py
            publisher_cloud/test_scan.py
            publisher_cloud/requirements.txt
            publisher_cloud/seeds.txt
            publisher_cloud/operator-public.pem
            publisher_cloud/leadengine/*.py
          retention-days: 3
          if-no-files-found: error
