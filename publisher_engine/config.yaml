# Local, free-first default. Quotas below count this installation only, not other apps using your keys.
data_dir: data
user_agent: PublisherContactResearch/1.0
crawl:
  concurrency: 3
  request_timeout_seconds: 18
  site_timeout_seconds: 150
  delay_seconds: 1.5
  max_pages_per_site: 8
  max_page_bytes: 2000000
  max_redirects: 5
  max_sites_per_run: 30
  revisit_days: 7
  verify_mx: true
  probe_common_paths: true
  sitemap: true
  commoncrawl: false
  external_candidates_per_site: 4
  max_public_profiles_per_site: 6  # Shared hard cap for both public Telegram hops.
search:
  enabled: true
  queries_per_run: 8
  results_per_query: 10
  contact_queries_per_run: 2
  prefer_messaging_recovery: true  # Email alone no longer stops messaging discovery.
  cache_days: 14
  # Round-robin among configured providers; empty keys are skipped.
  providers: [tavily, brave, firecrawl, serper, searxng]
  limits:
    tavily: {period: month, units: 700}
    brave: {period: month, units: 700}
    firecrawl: {period: month, units: 700}
    serper: {period: lifetime, units: 2000}
    searxng: {period: month, units: 1000}
    hunter: {period: month, units: 20}
  # Serper is a one-time trial, NOT a recurring free quota.
  # Firecrawl search reserves 2 credits/request. Tavily basic reserves 1.
  # Hunter reserves 10 credits/request for up to 10 revealed emails, across plan types.
hunter:
  enabled: false
  # Only source-backed generic business addresses; no guessed person emails.
  max_domains_per_run: 2
quality:
  ready_threshold: 75
  preferred_channels: [whatsapp, telegram, email, contact_form, skype, phone, social]
  max_contact_age_days: 30
schedule:
  enabled: true
  timezone: Asia/Jerusalem
  times: ['09:00', '18:00']
  # Runs only while the server and machine are on; no external scheduler is provisioned.
sheets:
  enabled: false
  tab_prefix: LeadEngine
  auto_sync_after_run: false
  # Owns/replaces only LeadEngine_Leads and LeadEngine_Contacts tabs.
retention_days: 90
